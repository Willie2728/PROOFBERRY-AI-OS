<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry Client-Ready Evidence Handoff</title>
  <desc id="desc">Illustrative early-access concept for staffing and recruiting teams showing a role criterion, candidate evidence, follow-up reasoning, recruiter note, and human decision handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#15102B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B2EFF"/><stop offset="1" stop-color="#23B8FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="250" fill="#8B2EFF" opacity="0.10"/>
  <circle cx="160" cy="1420" r="280" fill="#23B8FF" opacity="0.08"/>
  <text x="80" y="92" fill="#BDA8FF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="3">PROOFBERRY AI · STAFFING DESIGN PARTNER</text>
  <text x="80" y="190" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">Don’t just send a candidate.</text>
  <text x="80" y="265" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">Send the evidence a client can review.</text>
  <text x="80" y="330" fill="#AAB3C8" font-family="Arial, Helvetica, sans-serif" font-size="27">An illustrative early-access handoff for one live role.</text>
  <rect x="80" y="390" width="1040" height="4" rx="2" fill="url(#accent)"/>
  <g filter="url(#shadow)"><rect x="80" y="450" width="1040" height="190" rx="28" fill="#151C31" stroke="#2C3651"/><circle cx="145" cy="515" r="34" fill="#8B2EFF"/><text x="145" y="526" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="28" font-weight="800">1</text><text x="205" y="505" fill="#FFFFFF" font-family="Arial" font-size="31" font-weight="800">ROLE CRITERION</text><text x="205" y="550" fill="#C8D0E3" font-family="Arial" font-size="24">Define what the client actually needs for this role.</text><text x="205" y="595" fill="#7DD3FC" font-family="Arial" font-size="23">Example: “Explain a customer escalation and the reasoning behind your next action.”</text></g>
  <g filter="url(#shadow)"><rect x="80" y="675" width="1040" height="190" rx="28" fill="#151C31" stroke="#2C3651"/><circle cx="145" cy="740" r="34" fill="#6C4CFF"/><text x="145" y="751" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="28" font-weight="800">2</text><text x="205" y="730" fill="#FFFFFF" font-family="Arial" font-size="31" font-weight="800">CANDIDATE EVIDENCE</text><text x="205" y="775" fill="#C8D0E3" font-family="Arial" font-size="24">Attach a work sample, structured response, demonstration, or artifact.</text><text x="205" y="820" fill="#7DD3FC" font-family="Arial" font-size="23">The point is inspectable evidence—not another résumé adjective.</text></g>
  <g filter="url(#shadow)"><rect x="80" y="900" width="1040" height="190" rx="28" fill="#151C31" stroke="#2C3651"/><circle cx="145" cy="965" r="34" fill="#4B72FF"/><text x="145" y="976" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="28" font-weight="800">3</text><text x="205" y="955" fill="#FFFFFF" font-family="Arial" font-size="31" font-weight="800">FOLLOW-UP REASONING</text><text x="205" y="1000" fill="#C8D0E3" font-family="Arial" font-size="24">Ask the candidate to explain how and why they reached the answer.</text><text x="205" y="1045" fill="#7DD3FC" font-family="Arial" font-size="23">Clients see context around the signal instead of a score in isolation.</text></g>
  <g filter="url(#shadow)"><rect x="80" y="1125" width="1040" height="190" rx="28" fill="#151C31" stroke="#2C3651"/><circle cx="145" cy="1190" r="34" fill="#23B8FF"/><text x="145" y="1201" text-anchor="middle" fill="#08111F" font-family="Arial" font-size="28" font-weight="800">4</text><text x="205" y="1180" fill="#FFFFFF" font-family="Arial" font-size="31" font-weight="800">RECRUITER NOTE + HUMAN HANDOFF</text><text x="205" y="1225" fill="#C8D0E3" font-family="Arial" font-size="24">Record what matters, what remains unresolved, and what the client should inspect.</text><text x="205" y="1270" fill="#7DD3FC" font-family="Arial" font-size="23">Advancement and hiring decisions remain human-owned.</text></g>
  <rect x="80" y="1365" width="1040" height="128" rx="24" fill="#0D2031" stroke="#23B8FF" opacity="0.98"/>
  <text x="115" y="1415" fill="#FFFFFF" font-family="Arial" font-size="27" font-weight="800">DESIGN-PARTNER STARTING POINT</text>
  <text x="115" y="1460" fill="#C8D0E3" font-family="Arial" font-size="23">One live role. One small candidate cohort. One client-review workflow.</text>
  <text x="80" y="1550" fill="#7F8AA3" font-family="Arial" font-size="19">Illustrative early-access concept · No automatic hiring decision · Product workflow may evolve during pilot.</text>
</svg>