<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0b0918"/><text x="80" y="120" fill="#a78bfa" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="3">THE PROOFBERRY ROLE</text><text x="80" y="330" fill="#fff" font-family="Arial,sans-serif" font-size="66" font-weight="800"><tspan x="80" dy="0">ORGANIZE THE</tspan><tspan x="80" dy="82">EVIDENCE AROUND</tspan><tspan x="80" dy="82">THE ROLE.</tspan></text><g font-family="Arial,sans-serif"><rect x="80" y="650" width="920" height="118" rx="24" fill="#17132d" stroke="#3b2f68"/><text x="120" y="720" fill="#fff" font-size="36" font-weight="700">EXPLAIN</text><text x="345" y="720" fill="#94a3b8" font-size="30">How did you reason through it?</text><rect x="80" y="800" width="920" height="118" rx="24" fill="#17132d" stroke="#3b2f68"/><text x="120" y="870" fill="#fff" font-size="36" font-weight="700">DO</text><text x="345" y="870" fill="#94a3b8" font-size="30">Can you perform role-relevant work?</text><rect x="80" y="950" width="920" height="118" rx="24" fill="#17132d" stroke="#3b2f68"/><text x="120" y="1020" fill="#fff" font-size="36" font-weight="700">SHOW</text><text x="345" y="1020" fill="#94a3b8" font-size="30">Can a human reviewer inspect the evidence?</text></g><text x="80" y="1190" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="30">ProofBerry is being built around role-relevant capability evidence.</text><text x="80" y="1270" fill="#8b5cf6" font-family="Arial,sans-serif" font-size="24" font-weight="700">HUMAN-OWNED DECISIONS</text></svg>