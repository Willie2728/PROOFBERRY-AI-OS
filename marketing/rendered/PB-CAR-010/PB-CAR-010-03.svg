<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#100d20"/><stop offset="1" stop-color="#090713"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><text x="80" y="120" fill="#a78bfa" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="3">THE SCARCITY SHIFTS</text><text x="80" y="370" fill="#fff" font-family="Arial,sans-serif" font-size="68" font-weight="800"><tspan x="80" dy="0">WHEN APPLYING</tspan><tspan x="80" dy="84">GETS EASIER TO</tspan><tspan x="80" dy="84">AUTOMATE...</tspan></text><text x="80" y="760" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="56" font-weight="700">THE BETTER QUESTION IS:</text><text x="80" y="900" fill="#fff" font-family="Arial,sans-serif" font-size="66" font-weight="900"><tspan x="80" dy="0">WHAT CAN THIS PERSON</tspan><tspan x="80" dy="80">ACTUALLY DO?</tspan></text><text x="80" y="1190" fill="#94a3b8" font-family="Arial,sans-serif" font-size="30">Less emphasis on application friction. More emphasis on inspectable evidence.</text><text x="80" y="1270" fill="#8b5cf6" font-family="Arial,sans-serif" font-size="24" font-weight="700">PROOFBERRY AI · PB-CAR-010</text></svg>