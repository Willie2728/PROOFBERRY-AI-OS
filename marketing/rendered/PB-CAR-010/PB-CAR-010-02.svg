<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0b0a16"/><rect x="70" y="90" width="940" height="1170" rx="36" fill="#131126" stroke="#2e2757" stroke-width="2"/><text x="110" y="175" fill="#a78bfa" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="3">CUSTOMER TRUTH</text><text x="110" y="390" fill="#fff" font-family="Arial,sans-serif" font-size="150" font-weight="900">30%</text><text x="110" y="500" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="46" font-weight="700"><tspan x="110" dy="0">of surveyed active job seekers</tspan><tspan x="110" dy="62">said they were already using</tspan><tspan x="110" dy="62">AI agents for job-search tasks.</tspan></text><text x="110" y="790" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="34"><tspan x="110" dy="0">Search openings.</tspan><tspan x="110" dy="54">Submit applications.</tspan><tspan x="110" dy="54">Schedule interviews.</tspan></text><rect x="110" y="1030" width="860" height="2" fill="#4c1d95"/><text x="110" y="1105" fill="#94a3b8" font-family="Arial,sans-serif" font-size="24"><tspan x="110" dy="0">Source: Greenhouse, May 7, 2026.</tspan><tspan x="110" dy="38">Survey referenced: 2,950+ active job seekers.</tspan></text><text x="110" y="1225" fill="#8b5cf6" font-family="Arial,sans-serif" font-size="24" font-weight="700">AI CAN MOVE THE APPLICATION. SIGNAL STILL MATTERS.</text></svg>