<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#0b1020"/>
  <rect x="70" y="70" width="1060" height="1460" rx="36" fill="#121a31" stroke="#34466e" stroke-width="2"/>
  <text x="110" y="145" fill="#9fb3ff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PROOFBERRY AI • STAFFING DESIGN-PARTNER TOOL</text>
  <text x="110" y="230" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Define success before</text>
  <text x="110" y="300" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">you run the pilot.</text>
  <text x="110" y="365" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">One live role. One small cohort. A reviewable scorecard before expansion.</text>
  <rect x="110" y="425" width="980" height="142" rx="24" fill="#182443"/>
  <text x="145" y="475" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">WHY THIS MATTERS</text>
  <text x="145" y="520" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="25">SHRM's 2026 State of AI in HR found 56% of HR professionals said their</text>
  <text x="145" y="555" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="25">organizations do not formally measure the success of AI investments.</text>
  <text x="110" y="640" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">ONE-ROLE PILOT SCORECARD</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="685" width="470" height="180" rx="24" fill="#17213b" stroke="#2e426d"/>
    <text x="140" y="730" fill="#a5b4fc" font-size="24" font-weight="700">1 • REVIEW CLARITY</text>
    <text x="140" y="775" fill="#ffffff" font-size="24">Can the client see the role criterion,</text>
    <text x="140" y="810" fill="#ffffff" font-size="24">candidate evidence, follow-up reasoning,</text>
    <text x="140" y="845" fill="#ffffff" font-size="24">and remaining uncertainty?</text>
    <rect x="610" y="685" width="480" height="180" rx="24" fill="#17213b" stroke="#2e426d"/>
    <text x="640" y="730" fill="#a5b4fc" font-size="24" font-weight="700">2 • RECRUITER EFFORT</text>
    <text x="640" y="775" fill="#ffffff" font-size="24">Did the evidence handoff reduce avoidable</text>
    <text x="640" y="810" fill="#ffffff" font-size="24">rewriting, chasing, or explanation work?</text>
    <text x="640" y="845" fill="#ffffff" font-size="24">Measure time; do not assume savings.</text>
    <rect x="110" y="895" width="470" height="180" rx="24" fill="#17213b" stroke="#2e426d"/>
    <text x="140" y="940" fill="#a5b4fc" font-size="24" font-weight="700">3 • CLIENT USEFULNESS</text>
    <text x="140" y="985" fill="#ffffff" font-size="24">Did the client use the evidence packet to</text>
    <text x="140" y="1020" fill="#ffffff" font-size="24">ask better follow-up questions or make the</text>
    <text x="140" y="1055" fill="#ffffff" font-size="24">next review step clearer?</text>
    <rect x="610" y="895" width="480" height="180" rx="24" fill="#17213b" stroke="#2e426d"/>
    <text x="640" y="940" fill="#a5b4fc" font-size="24" font-weight="700">4 • CANDIDATE FRICTION</text>
    <text x="640" y="985" fill="#ffffff" font-size="24">Did the pilot add unreasonable steps, time,</text>
    <text x="640" y="1020" fill="#ffffff" font-size="24">or confusion for candidates? Record the</text>
    <text x="640" y="1055" fill="#ffffff" font-size="24">friction instead of hiding it.</text>
    <rect x="110" y="1105" width="980" height="205" rx="24" fill="#1a2a4f" stroke="#45619a"/>
    <text x="145" y="1155" fill="#7dd3fc" font-size="26" font-weight="700">5 • EXPANSION DECISION</text>
    <text x="145" y="1200" fill="#ffffff" font-size="25">At the end of the role, ask one practical question:</text>
    <text x="145" y="1250" fill="#ffffff" font-size="31" font-weight="800">Did this workflow earn a second role?</text>
    <text x="145" y="1290" fill="#cbd5e1" font-size="23">If not, document why. If yes, keep the decision human-owned and expand deliberately.</text>
  </g>
  <rect x="110" y="1350" width="980" height="105" rx="22" fill="#243b6b"/>
  <text x="145" y="1398" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">REQUEST A ONE-ROLE PROOFBERRY STAFFING DESIGN-PARTNER PILOT</text>
  <text x="145" y="1435" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="22">Illustrative early-access scorecard • no hiring, placement, compliance, or ROI guarantee.</text>
  <text x="110" y="1502" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Source for market context: SHRM, State of AI in HR 2026 (published Mar. 31, 2026).</text>
</svg>