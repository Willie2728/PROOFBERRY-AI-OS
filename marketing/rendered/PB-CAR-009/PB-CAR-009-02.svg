<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0b1020"/><rect x="70" y="70" width="940" height="1210" rx="38" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="110" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">WHAT CANDIDATES ARE TELLING US</text>
  <text x="110" y="275" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">AI interviews are mainstream.</text>
  <text x="110" y="335" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="36">Transparency has not caught up.</text>
  <text x="110" y="500" fill="#22d3ee" font-family="Arial, sans-serif" font-size="92" font-weight="800">63%</text>
  <text x="360" y="492" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">of surveyed active job seekers</text>
  <text x="360" y="538" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">had faced an AI interview.</text>
  <text x="110" y="700" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="92" font-weight="800">70%</text>
  <text x="360" y="692" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">said they were not clearly told</text>
  <text x="360" y="738" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">upfront that AI would evaluate them.</text>
  <text x="110" y="900" fill="#f8fafc" font-family="Arial, sans-serif" font-size="92" font-weight="800">38%</text>
  <text x="360" y="892" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">said they had walked away from</text>
  <text x="360" y="938" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34">a process because it used an AI interview.</text>
  <text x="110" y="1110" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Greenhouse Candidate AI Interview Report · May 1, 2026</text>
  <text x="110" y="1190" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="32" font-weight="700">Trust is not a one-way requirement.</text>
  <text x="110" y="1240" fill="#64748b" font-family="Arial, sans-serif" font-size="24">2 / 5</text>
</svg>