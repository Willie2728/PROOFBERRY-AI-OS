<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f172a"/><text x="80" y="120" fill="#94a3b8" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">THE PROOFBERRY STANDARD</text>
  <text x="80" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="64" font-weight="800">Make capability</text>
  <text x="80" y="335" fill="#22d3ee" font-family="Arial, sans-serif" font-size="64" font-weight="800">easier to inspect.</text>
  <rect x="80" y="430" width="920" height="120" rx="24" fill="#111827" stroke="#334155"/><text x="120" y="500" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">1 · Define the work that matters for the role.</text>
  <rect x="80" y="585" width="920" height="120" rx="24" fill="#111827" stroke="#334155"/><text x="120" y="655" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">2 · Tell candidates what evidence is expected.</text>
  <rect x="80" y="740" width="920" height="120" rx="24" fill="#111827" stroke="#334155"/><text x="120" y="810" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">3 · Let people explain, do, and show the work.</text>
  <rect x="80" y="895" width="920" height="120" rx="24" fill="#111827" stroke="#334155"/><text x="120" y="965" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">4 · Keep consequential decisions human-owned.</text>
  <text x="80" y="1130" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="35">Evidence-first does not have to mean suspicion-first.</text>
  <text x="80" y="1260" fill="#64748b" font-family="Arial, sans-serif" font-size="24">3 / 5 · ProofBerry AI</text>
</svg>