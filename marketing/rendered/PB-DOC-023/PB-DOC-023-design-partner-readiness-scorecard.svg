<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#08111f"/>
<rect x="72" y="72" width="1056" height="1456" rx="36" fill="#0d1b2c" stroke="#2d76ff" stroke-width="2"/>
<text x="110" y="155" fill="#70a5ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">PROOFBERRY AI · STAFFING DESIGN-PARTNER GATE</text>
<text x="110" y="255" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">Three signals before</text>
<text x="110" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">you call it a pilot.</text>
<text x="110" y="390" fill="#a9b8cf" font-family="Arial, sans-serif" font-size="28">Qualified interest is not the same as measurable pilot readiness.</text>
<rect x="110" y="470" width="980" height="190" rx="28" fill="#12243a"/>
<circle cx="175" cy="535" r="28" fill="#2d76ff"/><text x="166" y="545" fill="#fff" font-family="Arial" font-size="28" font-weight="700">1</text>
<text x="230" y="530" fill="#ffffff" font-family="Arial" font-size="36" font-weight="700">ACTIVE REQUISITION</text>
<text x="230" y="575" fill="#b7c4d6" font-family="Arial" font-size="25">A real role exists now — not a hypothetical future use case.</text>
<text x="230" y="615" fill="#7f93ad" font-family="Arial" font-size="22">Example: Senior Account Executive · Sacramento · open this month</text>
<rect x="110" y="690" width="980" height="190" rx="28" fill="#12243a"/>
<circle cx="175" cy="755" r="28" fill="#2d76ff"/><text x="166" y="765" fill="#fff" font-family="Arial" font-size="28" font-weight="700">2</text>
<text x="230" y="750" fill="#ffffff" font-family="Arial" font-size="36" font-weight="700">NAMED PILOT OWNER</text>
<text x="230" y="795" fill="#b7c4d6" font-family="Arial" font-size="25">Someone owns the test, the handoff, and the review conversation.</text>
<text x="230" y="835" fill="#7f93ad" font-family="Arial" font-size="22">No anonymous “innovation project” with nobody accountable.</text>
<rect x="110" y="910" width="980" height="190" rx="28" fill="#12243a"/>
<circle cx="175" cy="975" r="28" fill="#2d76ff"/><text x="166" y="985" fill="#fff" font-family="Arial" font-size="28" font-weight="700">3</text>
<text x="230" y="970" fill="#ffffff" font-family="Arial" font-size="36" font-weight="700">DECISION WINDOW</text>
<text x="230" y="1015" fill="#b7c4d6" font-family="Arial" font-size="25">Define when you will expand, revise, or stop after role #1.</text>
<text x="230" y="1055" fill="#7f93ad" font-family="Arial" font-size="22">A pilot without a decision date can become permanent ambiguity.</text>
<rect x="110" y="1160" width="980" height="210" rx="28" fill="#0a2a25" stroke="#3bd6a4" stroke-width="2"/>
<text x="150" y="1225" fill="#67e8bd" font-family="Arial" font-size="30" font-weight="800">3 / 3 = DESIGN-PARTNER READY</text>
<text x="150" y="1275" fill="#d8fff2" font-family="Arial" font-size="25">Keep the existing submission workflow beside the pilot.</text>
<text x="150" y="1315" fill="#d8fff2" font-family="Arial" font-size="25">Measure reviewer usefulness, recruiter effort, candidate friction,</text>
<text x="150" y="1355" fill="#d8fff2" font-family="Arial" font-size="25">unresolved questions, and whether the process earns role #2.</text>
<text x="110" y="1445" fill="#ffffff" font-family="Arial" font-size="28" font-weight="700">One role. One owner. One decision window.</text>
<text x="110" y="1490" fill="#8598b1" font-family="Arial" font-size="21">Early-access design method · consequential hiring decisions remain human-owned.</text>
</svg>