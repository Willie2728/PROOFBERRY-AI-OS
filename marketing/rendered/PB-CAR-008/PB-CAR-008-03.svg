<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#090713"/><circle cx="170" cy="220" r="300" fill="#23B8FF" opacity=".12"/><text x="80" y="110" fill="#D9B8FF" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">PROOFBERRY AI</text><text x="80" y="335" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="78" font-weight="800"><tspan x="80">Role-relevant proof</tspan><tspan x="80" dy="105">asks two things:</tspan></text><rect x="80" y="600" width="920" height="150" rx="28" fill="#171126" stroke="#8F63FF" stroke-opacity=".45"/><text x="120" y="668" fill="#C77DFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">1. What does this job actually require?</text><rect x="80" y="790" width="920" height="170" rx="28" fill="#171126" stroke="#23B8FF" stroke-opacity=".35"/><text x="120" y="858" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700"><tspan x="120">2. What evidence shows the candidate</tspan><tspan x="120" dy="52">can do that work?</tspan></text><text x="80" y="1160" fill="#D8D0E3" font-family="Arial,sans-serif" font-size="38">Same role. Same questions. Clearer signal.</text><text x="80" y="1240" fill="#9F94AE" font-family="Arial,sans-serif" font-size="24">3 / 5  •  Requirements → evidence</text><text x="80" y="1300" fill="#7A7086" font-family="Arial,sans-serif" font-size="20">A Wilkerson Collective Labs company</text></svg>