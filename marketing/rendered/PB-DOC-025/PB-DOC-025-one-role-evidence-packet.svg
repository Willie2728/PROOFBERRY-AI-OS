<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry One-Role Evidence Packet</title>
  <desc id="desc">Illustrative one-page staffing design-partner deliverable showing role requirements, evidence, gaps, follow-up questions, reviewer notes, and a human-owned expand, revise, or stop decision.</desc>
  <rect width="1200" height="1600" fill="#08111f"/>
  <rect x="56" y="56" width="1088" height="1488" rx="36" fill="#0d1a2d" stroke="#24364f" stroke-width="2"/>
  <text x="96" y="126" fill="#69e1c2" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="4">PROOFBERRY AI • STAFFING DESIGN-PARTNER PREVIEW</text>
  <text x="96" y="204" fill="#ffffff" font-size="58" font-family="Arial, Helvetica, sans-serif" font-weight="800">One-Role Evidence Packet</text>
  <text x="96" y="256" fill="#afbed1" font-size="28" font-family="Arial, Helvetica, sans-serif">The pilot needs a reviewable output — not just activity.</text>
  <rect x="96" y="304" width="1008" height="130" rx="22" fill="#102641" stroke="#2c5077"/>
  <text x="128" y="352" fill="#69e1c2" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700">PROPOSED EARLY-ACCESS DELIVERABLE</text>
  <text x="128" y="392" fill="#e8f0f9" font-size="24" font-family="Arial, Helvetica, sans-serif">One live requisition → one inspectable packet → one human review decision.</text>
  <text x="128" y="422" fill="#9eb0c5" font-size="18" font-family="Arial, Helvetica, sans-serif">Illustrative pilot method. It does not imply a validated hiring model or automated hiring decision.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="96" y="474" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="126" y="518" fill="#ffffff" font-size="23" font-weight="700">1 • Role requirements supplied</text><text x="126" y="556" fill="#b6c4d6" font-size="19">• Must-haves and useful context</text><text x="126" y="590" fill="#b6c4d6" font-size="19">• What evidence would be relevant</text><text x="126" y="624" fill="#b6c4d6" font-size="19">• What remains a human judgment</text>
    <rect x="616" y="474" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="646" y="518" fill="#ffffff" font-size="23" font-weight="700">2 • Evidence organized</text><text x="646" y="556" fill="#b6c4d6" font-size="19">• Candidate-provided material</text><text x="646" y="590" fill="#b6c4d6" font-size="19">• Claim → supporting evidence links</text><text x="646" y="624" fill="#b6c4d6" font-size="19">• Source / provenance notes where available</text>
    <rect x="96" y="694" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="126" y="738" fill="#ffffff" font-size="23" font-weight="700">3 • Gaps and conflicts surfaced</text><text x="126" y="776" fill="#b6c4d6" font-size="19">• Evidence not yet present</text><text x="126" y="810" fill="#b6c4d6" font-size="19">• Conflicting or unclear information</text><text x="126" y="844" fill="#b6c4d6" font-size="19">• No silent conversion into a hire/no-hire</text>
    <rect x="616" y="694" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="646" y="738" fill="#ffffff" font-size="23" font-weight="700">4 • Targeted follow-up</text><text x="646" y="776" fill="#b6c4d6" font-size="19">• Ask only what the open question needs</text><text x="646" y="810" fill="#b6c4d6" font-size="19">• Preserve candidate clarification</text><text x="646" y="844" fill="#b6c4d6" font-size="19">• Route exceptions to a named human</text>
    <rect x="96" y="914" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="126" y="958" fill="#ffffff" font-size="23" font-weight="700">5 • Reviewer notes</text><text x="126" y="996" fill="#b6c4d6" font-size="19">• What was useful to inspect</text><text x="126" y="1030" fill="#b6c4d6" font-size="19">• What still required manual work</text><text x="126" y="1064" fill="#b6c4d6" font-size="19">• What the packet did not establish</text>
    <rect x="616" y="914" width="488" height="190" rx="22" fill="#111f34" stroke="#28415f"/><text x="646" y="958" fill="#ffffff" font-size="23" font-weight="700">6 • Role #2 decision</text><text x="646" y="996" fill="#b6c4d6" font-size="19">• EXPAND — test a second role</text><text x="646" y="1030" fill="#b6c4d6" font-size="19">• REVISE — change the workflow first</text><text x="646" y="1064" fill="#b6c4d6" font-size="19">• STOP — do not expand</text>
  </g>
  <rect x="96" y="1146" width="1008" height="188" rx="26" fill="#0e2d2a" stroke="#2d7569" stroke-width="2"/>
  <text x="132" y="1198" fill="#69e1c2" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">THE CONTROL RULE</text><text x="132" y="1242" fill="#ffffff" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">Evidence can inform the reviewer.</text><text x="132" y="1282" fill="#ffffff" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">The consequential hiring decision stays human-owned.</text><text x="132" y="1314" fill="#9fc9c2" font-size="17" font-family="Arial, Helvetica, sans-serif">No claim of validated selection, identity verification, fraud detection, predictive validity, bias elimination, ATS integration, placement improvement, ROI, or automatic hiring.</text>
  <text x="96" y="1400" fill="#ffffff" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">Have one live role?</text><text x="96" y="1442" fill="#c2cfde" font-size="22" font-family="Arial, Helvetica, sans-serif">Bring one requisition, one accountable owner, and a finite decision window.</text><rect x="96" y="1474" width="462" height="50" rx="25" fill="#69e1c2"/><text x="128" y="1507" fill="#07131e" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="800">REQUEST ONE-ROLE DESIGN-PARTNER REVIEW</text>
</svg>