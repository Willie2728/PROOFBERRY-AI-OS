<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry AI — Make the verification method visible</title>
  <desc id="desc">A staffing design-partner planning card showing a transparent evidence method for one live role.</desc>
  <rect width="1200" height="1600" fill="#07111f"/>
  <rect x="58" y="58" width="1084" height="1484" rx="34" fill="#0b1729" stroke="#2a4263" stroke-width="2"/>
  <text x="92" y="126" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4" fill="#76d7ff">PROOFBERRY AI • STAFFING DESIGN-PARTNER METHOD</text>
  <text x="92" y="210" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Don’t just say</text>
  <text x="92" y="274" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff">“we verify candidates.”</text>
  <text x="92" y="338" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#7ce0b5">Show the method.</text>
  <text x="92" y="390" font-family="Inter,Arial,sans-serif" font-size="25" fill="#b8c6d9">Pilot planning artifact • one live role • existing stack stays in place</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="92" y="452" width="1016" height="146" rx="24" fill="#11243b" stroke="#2c4d72"/><circle cx="146" cy="525" r="28" fill="#76d7ff"/><text x="137" y="535" font-size="26" font-weight="800" fill="#07111f">1</text><text x="198" y="505" font-size="30" font-weight="750" fill="#ffffff">Name the role signal</text><text x="198" y="548" font-size="23" fill="#c1cddd">Agree what capability matters enough to inspect for this role.</text>
    <rect x="92" y="622" width="1016" height="146" rx="24" fill="#11243b" stroke="#2c4d72"/><circle cx="146" cy="695" r="28" fill="#76d7ff"/><text x="137" y="705" font-size="26" font-weight="800" fill="#07111f">2</text><text x="198" y="675" font-size="30" font-weight="750" fill="#ffffff">Collect comparable evidence</text><text x="198" y="718" font-size="23" fill="#c1cddd">Use the same core evidence question or demonstration across the pilot cohort.</text>
    <rect x="92" y="792" width="1016" height="146" rx="24" fill="#11243b" stroke="#2c4d72"/><circle cx="146" cy="865" r="28" fill="#76d7ff"/><text x="137" y="875" font-size="26" font-weight="800" fill="#07111f">3</text><text x="198" y="845" font-size="30" font-weight="750" fill="#ffffff">Record uncertainty</text><text x="198" y="888" font-size="23" fill="#c1cddd">Capture what is demonstrated, what is unclear, and the follow-up question still needed.</text>
    <rect x="92" y="962" width="1016" height="146" rx="24" fill="#11243b" stroke="#2c4d72"/><circle cx="146" cy="1035" r="28" fill="#76d7ff"/><text x="137" y="1045" font-size="26" font-weight="800" fill="#07111f">4</text><text x="198" y="1015" font-size="30" font-weight="750" fill="#ffffff">Add the recruiter’s context</text><text x="198" y="1058" font-size="23" fill="#c1cddd">Attach a reviewer note instead of hiding validation behind a generic “screened” label.</text>
    <rect x="92" y="1132" width="1016" height="146" rx="24" fill="#11243b" stroke="#2c4d72"/><circle cx="146" cy="1205" r="28" fill="#7ce0b5"/><text x="137" y="1215" font-size="26" font-weight="800" fill="#07111f">5</text><text x="198" y="1185" font-size="30" font-weight="750" fill="#ffffff">Hand the method to the client</text><text x="198" y="1228" font-size="23" fill="#c1cddd">Let a human reviewer see the evidence chain and own the consequential decision.</text>
  </g>
  <rect x="92" y="1320" width="1016" height="122" rx="24" fill="#0f2d2b" stroke="#2f7d69"/><text x="122" y="1365" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750" fill="#9af1cf">PILOT RULE</text><text x="122" y="1405" font-family="Inter,Arial,sans-serif" font-size="24" fill="#d3eee5">Compare this evidence handoff beside the staffing workflow you already use.</text>
  <text x="92" y="1492" font-family="Inter,Arial,sans-serif" font-size="20" fill="#8192a9">Illustrative early-access pilot method. No automatic-hiring, predictive-validity, bias-elimination,</text>
  <text x="92" y="1520" font-family="Inter,Arial,sans-serif" font-size="20" fill="#8192a9">compliance, placement, ATS-integration, or ROI claim. Human reviewers retain decision ownership.</text>
</svg>