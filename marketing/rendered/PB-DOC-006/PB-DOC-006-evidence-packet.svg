<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">ProofBerry AI — From Candidate Packet to Evidence Packet</title><desc id="desc">Illustrative staffing design-partner one-page brief showing how a standard candidate submission can be complemented by role criteria, candidate evidence, follow-up reasoning, recruiter notes, open questions, and human decision ownership.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081022"/><stop offset="0.55" stop-color="#11112d"/><stop offset="1" stop-color="#210f35"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.55" stop-color="#c026d3"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="1200" height="1600" fill="url(#bg)"/><g font-family="Inter, Arial, sans-serif" fill="#f8fafc"><text x="80" y="86" font-size="26" font-weight="700" letter-spacing="3">PROOFBERRY AI</text><text x="1120" y="86" text-anchor="end" font-size="18" fill="#c4b5fd">STAFFING DESIGN PARTNER • RUN 19</text><rect x="80" y="112" width="1040" height="5" rx="2.5" fill="url(#accent)"/><text x="80" y="205" font-size="64" font-weight="900">FROM CANDIDATE PACKET</text><text x="80" y="276" font-size="64" font-weight="900" fill="#e879f9">TO EVIDENCE PACKET</text><text x="80" y="330" font-size="25" fill="#cbd5e1">When submittal creation gets easier to automate, the differentiator moves inside the packet.</text><rect x="80" y="390" width="490" height="610" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/><text x="120" y="450" font-size="18" font-weight="800" fill="#94a3b8">STANDARD CLIENT SUBMISSION</text><text x="120" y="500" font-size="38" font-weight="800">Useful context.</text><text x="120" y="544" font-size="38" font-weight="800">Often hard to inspect.</text><g font-size="24" fill="#e2e8f0"><text x="120" y="620">• Resume / candidate summary</text><text x="120" y="685">• Availability and logistics</text><text x="120" y="750">• Recruiter notes</text><text x="120" y="815">• Interview snapshot</text><text x="120" y="880">• Presentation-ready narrative</text></g><text x="120" y="950" font-size="18" fill="#94a3b8">The packet can be polished while the client still asks:</text><text x="120" y="980" font-size="22" font-weight="700">“What evidence should I actually review?”</text><rect x="630" y="390" width="490" height="610" rx="28" fill="#17102a" stroke="#a855f7" stroke-width="2"/><text x="670" y="450" font-size="18" font-weight="800" fill="#e879f9">PROOFBERRY EVIDENCE PACKET</text><text x="670" y="500" font-size="38" font-weight="800">Make the proof</text><text x="670" y="544" font-size="38" font-weight="800">client-reviewable.</text><g font-size="23" fill="#f1f5f9"><text x="690" y="620">1. Role criterion</text><text x="690" y="690">2. Candidate artifact / evidence</text><text x="690" y="760">3. Follow-up reasoning</text><text x="690" y="830">4. Recruiter reviewer note</text><text x="690" y="900">5. Open question / uncertainty</text><text x="690" y="970">6. Human decision owner</text></g><rect x="80" y="1050" width="1040" height="300" rx="28" fill="#0b1221" stroke="#334155" stroke-width="2"/><text x="120" y="1115" font-size="18" font-weight="800" fill="#22d3ee">LOW-FRICTION DESIGN-PARTNER TEST</text><text x="120" y="1165" font-size="40" font-weight="850">Pilot one live role.</text><text x="120" y="1205" font-size="24" fill="#cbd5e1">Do not replace the recruiting stack. Test whether the client handoff becomes more inspectable.</text><text x="120" y="1285" font-size="20">Bring one live role → agree evidence questions → review a small candidate cohort</text><text x="80" y="1425" font-size="32" font-weight="850">Request staffing design-partner access.</text><text x="80" y="1465" font-size="20" fill="#cbd5e1">One role. Clear evidence questions. Human-owned decisions.</text><text x="80" y="1548" font-size="15" fill="#94a3b8">Illustrative early-access concept. No automatic hiring, placement-speed guarantee, bias-elimination claim, or predictive-validity claim.</text><text x="80" y="1575" font-size="15" fill="#94a3b8">ProofBerry organizes evidence for review; consequential hiring decisions remain human-owned.</text></g></svg>