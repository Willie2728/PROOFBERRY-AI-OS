<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry AI — Show the Criteria First</title>
  <desc id="desc">Illustrative evaluation transparency card showing role criterion, evidence request, AI assistance, and human decision ownership.</desc>
  <rect width="1200" height="1600" fill="#07131f"/>
  <rect x="60" y="60" width="1080" height="1480" rx="40" fill="#0b1f31" stroke="#5bd5c5" stroke-width="2"/>
  <text x="110" y="145" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="5">PROOFBERRY AI</text>
  <text x="110" y="255" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">Show the criteria</text>
  <text x="110" y="335" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">before the score.</text>
  <text x="110" y="395" fill="#b8c9d8" font-family="Arial, Helvetica, sans-serif" font-size="29">Illustrative evaluation transparency card — not a hiring decision.</text>
  <rect x="110" y="470" width="980" height="200" rx="28" fill="#102a40"/>
  <text x="150" y="525" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">1  ROLE CRITERION</text>
  <text x="150" y="580" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">Customer objection handling</text>
  <text x="150" y="625" fill="#c7d5e0" font-family="Arial, Helvetica, sans-serif" font-size="25">Example only: define the capability before asking for proof.</text>
  <rect x="110" y="700" width="980" height="230" rx="28" fill="#102a40"/>
  <text x="150" y="755" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2  EVIDENCE REQUEST</text>
  <text x="150" y="810" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">“A customer says your promised delivery failed.</text>
  <text x="150" y="852" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Explain what you would do next — and why.”</text>
  <text x="150" y="900" fill="#c7d5e0" font-family="Arial, Helvetica, sans-serif" font-size="25">Ask for reasoning and role-relevant evidence, not résumé polish.</text>
  <rect x="110" y="960" width="470" height="300" rx="28" fill="#102a40"/>
  <text x="150" y="1018" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3  AI MAY HELP</text>
  <text x="150" y="1075" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Organize the transcript</text>
  <text x="150" y="1120" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Map evidence to criteria</text>
  <text x="150" y="1165" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Surface follow-up questions</text>
  <text x="150" y="1215" fill="#c7d5e0" font-family="Arial, Helvetica, sans-serif" font-size="23">Assistance should be explainable.</text>
  <rect x="620" y="960" width="470" height="300" rx="28" fill="#102a40"/>
  <text x="660" y="1018" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">4  HUMAN OWNS</text>
  <text x="660" y="1075" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">What evidence matters</text>
  <text x="660" y="1120" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">What remains uncertain</text>
  <text x="660" y="1165" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Whether to advance</text>
  <text x="660" y="1215" fill="#c7d5e0" font-family="Arial, Helvetica, sans-serif" font-size="23">The hiring decision stays human.</text>
  <rect x="110" y="1295" width="980" height="150" rx="28" fill="#0e382f" stroke="#5bd5c5" stroke-width="2"/>
  <text x="150" y="1352" fill="#8af0df" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">THE TRANSPARENCY TEST</text>
  <text x="150" y="1405" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Can the candidate see what is being evaluated — before it is evaluated?</text>
  <text x="110" y="1505" fill="#95a9ba" font-family="Arial, Helvetica, sans-serif" font-size="21">Concept preview for ProofBerry early access. Illustrative sample; no real candidate data.</text>
</svg>