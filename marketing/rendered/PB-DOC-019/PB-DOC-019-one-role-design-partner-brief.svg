<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#0B1020"/>
  <rect x="70" y="70" width="1060" height="1460" rx="36" fill="#111A33" stroke="#2B3B68" stroke-width="2"/>
  <text x="110" y="140" fill="#9FB5FF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">PROOFBERRY AI · EARLY-ACCESS DESIGN PARTNER</text>
  <text x="110" y="235" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Don’t start with an AI</text>
  <text x="110" y="305" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">transformation.</text>
  <text x="110" y="375" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Start with one live role.</text>
  <text x="110" y="440" fill="#C9D4F5" font-family="Arial, Helvetica, sans-serif" font-size="30">A bounded staffing pilot built to be inspected — not blindly trusted.</text>
  <rect x="110" y="505" width="980" height="205" rx="24" fill="#172345"/>
  <text x="145" y="555" fill="#9FB5FF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">YOU BRING</text>
  <text x="145" y="605" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• One active requisition and the role-critical must-haves</text>
  <text x="145" y="650" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• One staffing-side owner and one client-side reviewer</text>
  <text x="145" y="695" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• Your existing submission process stays in place for comparison</text>
  <rect x="110" y="745" width="980" height="300" rx="24" fill="#172345"/>
  <text x="145" y="795" fill="#9FB5FF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">PROPOSED PILOT DELIVERABLE</text>
  <text x="145" y="845" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• Structured evidence packet prototype for the selected role</text>
  <text x="145" y="890" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• Evidence source labels plus coverage, gaps, conflicts and unknowns</text>
  <text x="145" y="935" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• Targeted follow-up prompts only where review risk remains</text>
  <text x="145" y="980" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• Review notes that keep the consequential decision human-owned</text>
  <text x="145" y="1025" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">• End-of-pilot decision: expand, revise, or stop</text>
  <rect x="110" y="1080" width="980" height="250" rx="24" fill="#172345"/>
  <text x="145" y="1130" fill="#9FB5FF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">MEASURE BEFORE YOU SCALE</text>
  <text x="145" y="1180" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">Reviewer usefulness · Recruiter effort · Candidate friction</text>
  <text x="145" y="1225" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">Open questions · Handoff clarity · Whether the workflow earns role #2</text>
  <text x="145" y="1280" fill="#C9D4F5" font-family="Arial, Helvetica, sans-serif" font-size="24">These are pilot measurement dimensions — not promised outcomes.</text>
  <rect x="110" y="1370" width="980" height="92" rx="18" fill="#3457D5"/>
  <text x="600" y="1427" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Bring one live role. Compare the handoff.</text>
  <text x="110" y="1500" fill="#98A8CF" font-family="Arial, Helvetica, sans-serif" font-size="20">Illustrative early-access pilot method. No automatic hiring, ROI, compliance, placement, or ATS-integration claim.</text>
</svg>