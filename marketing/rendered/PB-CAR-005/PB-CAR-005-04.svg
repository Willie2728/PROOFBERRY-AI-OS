<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0710"/><stop offset="1" stop-color="#24113A"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><text x="80" y="110" fill="#D9B8FF" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">PROOFBERRY AI</text><text x="80" y="300" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="78" font-weight="800"><tspan x="80" dy="0">Built for the</tspan><tspan x="80" dy="92">agentic hiring era.</tspan></text><rect x="80" y="540" width="920" height="470" rx="36" fill="#FFFFFF" opacity=".055" stroke="#6B3DA0" stroke-width="2"/><text x="120" y="650" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="42" font-weight="700">ProofBerry is being built to:</text><text x="140" y="750" fill="#D8D0E3" font-family="Arial,sans-serif" font-size="36">• Organize role-specific capability evidence</text><text x="140" y="825" fill="#D8D0E3" font-family="Arial,sans-serif" font-size="36">• Make signals easier to inspect</text><text x="140" y="900" fill="#D8D0E3" font-family="Arial,sans-serif" font-size="36">• Help people and AI-assisted systems</text><text x="176" y="950" fill="#D8D0E3" font-family="Arial,sans-serif" font-size="36">understand what a candidate can do</text><text x="80" y="1110" fill="#C77DFF" font-family="Arial,sans-serif" font-size="46" font-weight="800">Human decisions stay human.</text><text x="80" y="1240" fill="#9F94AE" font-family="Arial,sans-serif" font-size="24">4 / 5  •  Evidence + transparency</text><text x="80" y="1300" fill="#7A7086" font-family="Arial,sans-serif" font-size="20">A Wilkerson Collective Labs company</text></svg>