<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#07111f"/><rect x="70" y="205" width="940" height="890" rx="42" fill="#0d1c2f" stroke="#204c72" stroke-width="2"/><text x="86" y="145" fill="#76e4f7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">THREE QUESTIONS FOR EVERY SCORE</text><text x="120" y="360" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">1  What role criterion?</text><text x="120" y="560" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">2  What was observed?</text><text x="120" y="760" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">3  What can a human inspect?</text><text x="120" y="980" fill="#a8b7c8" font-family="Arial, Helvetica, sans-serif" font-size="34">A useful score should lead back to evidence,</text><text x="120" y="1030" fill="#a8b7c8" font-family="Arial, Helvetica, sans-serif" font-size="34">not end the conversation.</text><text x="86" y="1240" fill="#6e8197" font-family="Arial, Helvetica, sans-serif" font-size="28">2 / 5</text></svg>