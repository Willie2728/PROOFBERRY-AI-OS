<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#07111f"/><circle cx="180" cy="1040" r="260" fill="#12375a" opacity="0.5"/><text x="86" y="145" fill="#76e4f7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">AI CAN ORGANIZE. HUMANS DECIDE.</text><text x="86" y="355" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Use AI to structure</text><text x="86" y="445" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">the evidence.</text><text x="86" y="620" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Keep the hiring</text><text x="86" y="710" fill="#76e4f7" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">decision human-owned.</text><text x="86" y="1010" fill="#a8b7c8" font-family="Arial, Helvetica, sans-serif" font-size="34">Role criteria → observed evidence → human review.</text><text x="86" y="1240" fill="#6e8197" font-family="Arial, Helvetica, sans-serif" font-size="28">4 / 5</text></svg>