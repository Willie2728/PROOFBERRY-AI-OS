<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry Identity Check Is Not a Capability Check</title>
  <desc id="desc">Staffing design-partner card separating identity and fraud controls from role-relevant capability evidence and human hiring judgment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10051f"/><stop offset="0.52" stop-color="#18102d"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b86cff"/><stop offset="1" stop-color="#45d7ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="1030" cy="180" r="220" fill="#6f2cff" opacity="0.16" filter="url(#glow)"/>
  <circle cx="165" cy="1370" r="230" fill="#00b2df" opacity="0.10" filter="url(#glow)"/>
  <rect x="72" y="68" width="1056" height="1464" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="96" y="130" fill="#baa6d7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">PROOFBERRY AI · STAFFING DESIGN PARTNER</text>
  <text x="96" y="226" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800">An identity check</text>
  <text x="96" y="302" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800">is not a capability check.</text>
  <text x="96" y="365" fill="#c8c3d2" font-family="Arial, Helvetica, sans-serif" font-size="28">Hiring still needs role-relevant evidence a client can inspect and question.</text>
  <rect x="96" y="438" width="482" height="310" rx="30" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="130" y="494" fill="#8cddff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">IDENTITY / FRAUD LAYER</text>
  <text x="130" y="556" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">Who entered the process?</text>
  <text x="130" y="610" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">Is the person present?</text>
  <text x="130" y="664" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">Are claimed records consistent?</text>
  <text x="130" y="716" fill="#9e98a7" font-family="Arial, Helvetica, sans-serif" font-size="21">Important controls — but not the whole hiring question.</text>
  <rect x="622" y="438" width="482" height="310" rx="30" fill="#6d39ad" fill-opacity="0.15" stroke="#b86cff" stroke-opacity="0.34"/>
  <text x="656" y="494" fill="#caa7ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">CAPABILITY EVIDENCE LAYER</text>
  <text x="656" y="556" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">What does the role require?</text>
  <text x="656" y="610" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">What work can be inspected?</text>
  <text x="656" y="664" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">What remains uncertain?</text>
  <text x="656" y="716" fill="#b9b1c6" font-family="Arial, Helvetica, sans-serif" font-size="21">This is the ProofBerry design-partner wedge.</text>
  <text x="96" y="842" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Give the client something challengeable.</text>
  <rect x="96" y="890" width="1008" height="320" rx="30" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="130" y="950" fill="#8cddff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ONE-ROLE EVIDENCE HANDOFF</text>
  <text x="130" y="1012" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">1  ·  Role criterion</text>
  <text x="130" y="1062" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">2  ·  Candidate work artifact or demonstration</text>
  <text x="130" y="1112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">3  ·  Follow-up reasoning + recruiter reviewer note</text>
  <text x="130" y="1162" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30">4  ·  Open question the client still needs answered</text>
  <text x="96" y="1298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="800">The packet should support judgment — not replace it.</text>
  <text x="96" y="1352" fill="#c8c3d2" font-family="Arial, Helvetica, sans-serif" font-size="27">ProofBerry is being built to add role-relevant capability evidence beside the staffing workflow you already use.</text>
  <rect x="96" y="1416" width="1008" height="74" rx="37" fill="url(#accent)"/>
  <text x="600" y="1464" text-anchor="middle" fill="#09111d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">BRING ONE ROLE WHERE RÉSUMÉ POLISH ISN'T ENOUGH</text>
  <text x="96" y="1524" fill="#8f8a9b" font-family="Arial, Helvetica, sans-serif" font-size="17">Illustrative early-access positioning. ProofBerry does not claim to verify identity, eliminate fraud or bias, guarantee compliance, predict performance, or make hiring decisions.</text>
</svg>