<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry Evidence Specification Card</title>
  <desc id="desc">Illustrative staffing design-partner worksheet for defining role criteria, acceptable evidence, follow-up questions, and human decision ownership before a pilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10051f"/><stop offset="0.52" stop-color="#18102d"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b86cff"/><stop offset="1" stop-color="#45d7ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="1030" cy="190" r="220" fill="#6f2cff" opacity="0.16" filter="url(#glow)"/>
  <circle cx="160" cy="1380" r="230" fill="#00b2df" opacity="0.10" filter="url(#glow)"/>
  <rect x="72" y="68" width="1056" height="1464" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="96" y="130" fill="#baa6d7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">PROOFBERRY AI · STAFFING DESIGN PARTNER</text>
  <text x="96" y="226" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Skills-first hiring needs</text>
  <text x="96" y="300" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">an evidence specification.</text>
  <text x="96" y="365" fill="#c8c3d2" font-family="Arial, Helvetica, sans-serif" font-size="27">Before a pilot starts, define what the client should be able to inspect.</text>
  <rect x="96" y="430" width="1008" height="735" rx="32" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="130" y="490" fill="#8cddff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">ONE-ROLE EVIDENCE SPEC</text>
  <text x="130" y="558" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1 · ROLE CRITERION</text>
  <text x="130" y="600" fill="#bdb7c8" font-family="Arial, Helvetica, sans-serif" font-size="23">What capability matters for this specific requisition?</text>
  <line x1="130" y1="625" x2="1070" y2="625" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="688" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2 · ACCEPTABLE EVIDENCE</text>
  <text x="130" y="730" fill="#bdb7c8" font-family="Arial, Helvetica, sans-serif" font-size="23">What work artifact, demonstration, or explanation is relevant?</text>
  <line x1="130" y1="755" x2="1070" y2="755" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="818" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3 · FOLLOW-UP QUESTION</text>
  <text x="130" y="860" fill="#bdb7c8" font-family="Arial, Helvetica, sans-serif" font-size="23">What should a human reviewer ask when evidence is incomplete?</text>
  <line x1="130" y1="885" x2="1070" y2="885" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="948" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">4 · REVIEWER NOTE</text>
  <text x="130" y="990" fill="#bdb7c8" font-family="Arial, Helvetica, sans-serif" font-size="23">What did the recruiter observe, and what remains uncertain?</text>
  <line x1="130" y1="1015" x2="1070" y2="1015" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="1078" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">5 · DECISION OWNER</text>
  <text x="130" y="1120" fill="#bdb7c8" font-family="Arial, Helvetica, sans-serif" font-size="23">Who owns the consequential hiring decision after reviewing the packet?</text>
  <text x="96" y="1250" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">Define the evidence before you score the evidence.</text>
  <text x="96" y="1306" fill="#c8c3d2" font-family="Arial, Helvetica, sans-serif" font-size="26">ProofBerry's early staffing pilot should make criteria, evidence, uncertainty, and human ownership explicit.</text>
  <rect x="96" y="1390" width="1008" height="78" rx="39" fill="url(#accent)"/>
  <text x="600" y="1440" text-anchor="middle" fill="#09111d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">BRING ONE LIVE ROLE · DEFINE THE EVIDENCE FIRST</text>
  <text x="96" y="1512" fill="#8f8a9b" font-family="Arial, Helvetica, sans-serif" font-size="16">Illustrative early-access worksheet. ProofBerry currently has no finalized RubricCriterion records configured in the connected app. No claim of validated scoring, compliance, bias elimination, predictive validity, placement outcomes, or automated hiring.</text>
</svg>