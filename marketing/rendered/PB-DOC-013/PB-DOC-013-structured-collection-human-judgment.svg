<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">ProofBerry — Standardize the evidence. Keep the decision human.</title>
  <desc id="desc">Illustrative one-role staffing pilot protocol separating structured evidence collection from human hiring judgment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1628"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.26"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/><circle cx="980" cy="150" r="260" fill="#2563eb" opacity="0.08"/><circle cx="140" cy="1460" r="300" fill="#7c3aed" opacity="0.07"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="84" y="92" fill="#93c5fd" font-size="24" font-weight="700" letter-spacing="4">PROOFBERRY AI · STAFFING DESIGN-PARTNER PILOT</text>
    <text x="84" y="182" fill="#f8fafc" font-size="66" font-weight="760">Standardize the evidence.</text><text x="84" y="255" fill="url(#accent)" font-size="66" font-weight="760">Keep the decision human.</text>
    <text x="84" y="316" fill="#cbd5e1" font-size="28">A one-role protocol for more consistent evidence collection without turning AI into the hiring authority.</text>
    <g transform="translate(84 390)" filter="url(#shadow)"><rect width="1032" height="690" rx="34" fill="#0f1b2e" stroke="#334155" stroke-width="2"/><text x="44" y="58" fill="#94a3b8" font-size="22" font-weight="700" letter-spacing="2">ONE LIVE ROLE · FIVE CONTROL POINTS</text>
      <g transform="translate(44 96)"><g><circle cx="32" cy="34" r="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="32" y="43" text-anchor="middle" fill="#dbeafe" font-size="25" font-weight="800">1</text><text x="86" y="29" fill="#f8fafc" font-size="27" font-weight="700">Define the role criterion</text><text x="86" y="62" fill="#94a3b8" font-size="20">Name the capability the client actually needs to inspect.</text></g><line x1="32" y1="70" x2="32" y2="120" stroke="#334155" stroke-width="3"/>
      <g transform="translate(0 122)"><circle cx="32" cy="34" r="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="32" y="43" text-anchor="middle" fill="#dbeafe" font-size="25" font-weight="800">2</text><text x="86" y="29" fill="#f8fafc" font-size="27" font-weight="700">Ask the same core evidence question</text><text x="86" y="62" fill="#94a3b8" font-size="20">Standardize the information request — not the verdict.</text></g><line x1="32" y1="192" x2="32" y2="242" stroke="#334155" stroke-width="3"/>
      <g transform="translate(0 244)"><circle cx="32" cy="34" r="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="32" y="43" text-anchor="middle" fill="#dbeafe" font-size="25" font-weight="800">3</text><text x="86" y="29" fill="#f8fafc" font-size="27" font-weight="700">Capture work, explanation, or demonstration</text><text x="86" y="62" fill="#94a3b8" font-size="20">Give the reviewer inspectable material, not only a score.</text></g><line x1="32" y1="314" x2="32" y2="364" stroke="#334155" stroke-width="3"/>
      <g transform="translate(0 366)"><circle cx="32" cy="34" r="30" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="32" y="43" text-anchor="middle" fill="#ede9fe" font-size="25" font-weight="800">4</text><text x="86" y="29" fill="#f8fafc" font-size="27" font-weight="700">Record uncertainty and the next follow-up</text><text x="86" y="62" fill="#94a3b8" font-size="20">“Insufficient evidence” is a valid state — not a forced conclusion.</text></g><line x1="32" y1="436" x2="32" y2="486" stroke="#334155" stroke-width="3"/>
      <g transform="translate(0 488)"><circle cx="32" cy="34" r="30" fill="#052e2b" stroke="#5eead4" stroke-width="2"/><text x="32" y="43" text-anchor="middle" fill="#ccfbf1" font-size="25" font-weight="800">5</text><text x="86" y="29" fill="#f8fafc" font-size="27" font-weight="700">Human reviewer owns the consequential decision</text><text x="86" y="62" fill="#94a3b8" font-size="20">Advance, reject, interview, or hire remains accountable human judgment.</text></g></g></g>
    <g transform="translate(84 1130)"><text x="0" y="0" fill="#94a3b8" font-size="22" font-weight="700" letter-spacing="2">PILOT QUESTION</text><text x="0" y="55" fill="#f8fafc" font-size="39" font-weight="700">Did the client get a clearer, more reviewable handoff?</text><text x="0" y="100" fill="#cbd5e1" font-size="24">Compare one role beside the workflow you already use. Expand only if the protocol earns a second role.</text></g>
    <g transform="translate(84 1304)"><rect width="1032" height="150" rx="28" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="36" y="48" fill="#f8fafc" font-size="27" font-weight="750">Bring one live role.</text><text x="36" y="88" fill="#cbd5e1" font-size="23">Standardize the evidence collection before you automate the judgment.</text><text x="36" y="125" fill="#94a3b8" font-size="18">Illustrative early-access pilot protocol · no automatic-hiring, compliance, bias-elimination, predictive-validity, placement, or ROI claim.</text></g>
    <text x="84" y="1534" fill="#64748b" font-size="18">ProofBerry AI · role-relevant capability evidence for accountable human review</text>
  </g>
</svg>