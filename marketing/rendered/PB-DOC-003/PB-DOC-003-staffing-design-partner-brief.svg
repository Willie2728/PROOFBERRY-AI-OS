<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#07111f"/>
  <rect x="70" y="70" width="1060" height="1460" rx="34" fill="#0c1727" stroke="#24354d" stroke-width="2"/>
  <text x="110" y="150" fill="#77e5ff" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">PROOFBERRY AI · STAFFING DESIGN PARTNER</text>
  <text x="110" y="235" fill="#ffffff" font-size="58" font-family="Arial, Helvetica, sans-serif" font-weight="800">More AI. More applications.</text>
  <text x="110" y="305" fill="#ffffff" font-size="58" font-family="Arial, Helvetica, sans-serif" font-weight="800">Human judgment still matters.</text>
  <text x="110" y="365" fill="#a9b8cc" font-size="27" font-family="Arial, Helvetica, sans-serif">A proposed early-access workflow for staffing and recruiting firms.</text>
  <rect x="110" y="420" width="980" height="250" rx="24" fill="#101f33" stroke="#254366"/>
  <text x="145" y="475" fill="#77e5ff" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="700">CUSTOMER TRUTH</text>
  <text x="145" y="525" fill="#ffffff" font-size="26" font-family="Arial, Helvetica, sans-serif">• ASA reported recruiter call time reached 286 minutes/week in Q1 2026</text>
  <text x="145" y="567" fill="#ffffff" font-size="26" font-family="Arial, Helvetica, sans-serif">  while staffing recruiters used more AI tools.</text>
  <text x="145" y="615" fill="#ffffff" font-size="26" font-family="Arial, Helvetica, sans-serif">• Robert Half reported 67% of surveyed HR leaders were using staffing firms,</text>
  <text x="145" y="657" fill="#ffffff" font-size="26" font-family="Arial, Helvetica, sans-serif">  and 89% said those partners were effective on AI-related hiring challenges.</text>
  <text x="110" y="755" fill="#ffffff" font-size="40" font-family="Arial, Helvetica, sans-serif" font-weight="800">Proposed design-partner workflow</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="27">
    <circle cx="140" cy="830" r="23" fill="#77e5ff"/><text x="132" y="839" fill="#07111f" font-weight="800">1</text><text x="185" y="840" fill="#ffffff">Choose one live role and define the role-relevant criteria.</text>
    <circle cx="140" cy="910" r="23" fill="#77e5ff"/><text x="132" y="919" fill="#07111f" font-weight="800">2</text><text x="185" y="920" fill="#ffffff">Invite a small candidate cohort to explain, demonstrate, and show work.</text>
    <circle cx="140" cy="990" r="23" fill="#77e5ff"/><text x="132" y="999" fill="#07111f" font-weight="800">3</text><text x="185" y="1000" fill="#ffffff">Review an evidence packet: criterion → artifact → follow-up → reviewer note.</text>
    <circle cx="140" cy="1070" r="23" fill="#77e5ff"/><text x="132" y="1079" fill="#07111f" font-weight="800">4</text><text x="185" y="1080" fill="#ffffff">Use human judgment for advancement, client presentation, and hiring.</text>
  </g>
  <rect x="110" y="1160" width="980" height="205" rx="24" fill="#0e2b31" stroke="#2f7d88"/>
  <text x="145" y="1215" fill="#8ff3dd" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="700">WHAT PROOFBERRY IS TESTING</text>
  <text x="145" y="1265" fill="#ffffff" font-size="27" font-family="Arial, Helvetica, sans-serif">Can structured, inspectable candidate evidence help a staffing recruiter</text>
  <text x="145" y="1307" fill="#ffffff" font-size="27" font-family="Arial, Helvetica, sans-serif">have a more specific client conversation without pretending AI makes the</text>
  <text x="145" y="1349" fill="#ffffff" font-size="27" font-family="Arial, Helvetica, sans-serif">final decision?</text>
  <text x="110" y="1430" fill="#77e5ff" font-size="31" font-family="Arial, Helvetica, sans-serif" font-weight="800">Recruiter / Staffing Early Access → ProofBerry waitlist</text>
  <text x="110" y="1475" fill="#7f91a8" font-size="20" font-family="Arial, Helvetica, sans-serif">Illustrative early-access concept. No hiring-speed, placement, revenue, or quality-of-hire guarantee.</text>
  <text x="110" y="1510" fill="#7f91a8" font-size="18" font-family="Arial, Helvetica, sans-serif">Sources: American Staffing Association, Jun 4 2026 · Robert Half, Mar 10 2026.</text>
</svg>